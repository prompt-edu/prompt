name: Build and Deploy to Dev

on:
  # Every PR runs, so the `ci-passed` required check always reports. The
  # `changes` job skips the build, test and e2e jobs when only the paths below
  # changed; a `paths-ignore` here would leave such a PR waiting on a required
  # check that never reports.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/build-docs.yml"
      - ".github/workflows/discord-notifications.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Which servers, clients and e2e shards a PR needs, from scripts/ci-changes.mjs.
  # Paths outside any registered module select everything, and so does a push
  # to main, which only gets here past `paths-ignore`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
      servers: ${{ steps.select.outputs.servers }}
      clients: ${{ steps.select.outputs.clients }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      # The PR merge commit's first parent is the base branch tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Test the change selection
        run: node --test scripts/ci-changes.test.mjs
      - name: Select the affected modules
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | node scripts/ci-changes.mjs | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/ci-changes.mjs --all | tee -a "$GITHUB_OUTPUT"
          fi

  assign-author:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Assign PR author
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const authorType = pr.user.type;
            if (authorType === 'Bot') {
              console.log(`Skipping assignment: PR author "${author}" is a bot.`);
              return;
            }
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });
            } catch (error) {
              console.log(`Could not assign author "${author}": ${error.message}`);
            }

  detect-migrations:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/detect-migrations.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
  quality-servers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/quality-servers.yml
    with:
      servers: ${{ needs.changes.outputs.servers }}
  test-servers:
    needs: [changes, quality-servers]
    uses: ./.github/workflows/test-servers.yml
    with:
      servers: ${{ needs.changes.outputs.servers }}
  build-servers:
    needs:
      - changes
      - quality-servers
      - test-servers
    uses: ./.github/workflows/build-and-push-servers.yml
    secrets: inherit
    with:
      servers: ${{ needs.changes.outputs.servers }}
  quality-clients:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/quality-clients.yml
    with:
      clients: ${{ needs.changes.outputs.clients }}
  e2e-tests:
    needs: [changes, quality-servers, quality-clients]
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read
    with:
      shards: ${{ needs.changes.outputs.shards }}
  # Blocks the PR through ci-passed, but is not a deploy-dev dependency: a finding
  # does not hold back the deploy.
  api-stress-tests:
    needs: [changes, quality-servers]
    uses: ./.github/workflows/test-api-stress.yml
    permissions:
      contents: read
    with:
      servers: ${{ needs.changes.outputs.servers }}
  build-clients:
    needs: [changes, quality-clients]
    uses: ./.github/workflows/build-and-push-clients.yml
    secrets: inherit
    with:
      clients: ${{ needs.changes.outputs.clients }}
  # The one check the main ruleset requires. A skipped job that calls a reusable
  # workflow reports under its own name (`build-clients`), never the nested
  # names (`build-clients / core / merge`), so requiring those left docs-only
  # PRs waiting forever. The nested jobs of modules a PR leaves untouched are
  # skipped inside the reusable workflows, so their callers still succeed. Code
  # changes need every job to succeed; docs-only changes need them all skipped.
  # It runs even on a cancelled run: GitHub treats a skipped required check as
  # passed, and the script fails on `cancelled`.
  ci-passed:
    needs:
      - changes
      - quality-servers
      - test-servers
      - build-servers
      - quality-clients
      - e2e-tests
      - api-stress-tests
      - build-clients
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every CI job has the expected result
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CODE_CHANGED" = "true" ]; then expected=success; else expected=skipped; fi
          echo "Code changed: ${CODE_CHANGED:-unknown}, expecting every CI job to be $expected"
          failed=0
          while IFS=$'\t' read -r job result; do
            want=$expected
            [ "$job" = "changes" ] && want=success
            echo "$job = $result"
            if [ "$result" != "$want" ]; then
              echo "::error::CI job '$job' is $result, expected $want"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")
          exit $failed

  # Images a PR did not rebuild deploy from the `main` tag, which every push to main updates.
  # `latest` is no fallback: releases push it too, possibly from an older commit.
  deploy-dev:
    needs: [build-clients, build-servers, e2e-tests]
    uses: ./.github/workflows/deploy-docker.yml
    secrets: inherit
    with:
      environment: prompt-dev-vm
      core_image_tag: ${{ needs.build-clients.outputs.core_image_tag || 'main' }}
      example_image_tag: ${{ needs.build-clients.outputs.example_image_tag || 'main' }}
      interview_image_tag: ${{ needs.build-clients.outputs.interview_image_tag || 'main' }}
      matching_image_tag: ${{ needs.build-clients.outputs.matching_image_tag || 'main' }}
      assessment_image_tag: ${{ needs.build-clients.outputs.assessment_image_tag || 'main' }}
      team_allocation_image_tag: ${{ needs.build-clients.outputs.team_allocation_image_tag || 'main' }}
      self_team_allocation_image_tag: ${{ needs.build-clients.outputs.self_team_allocation_image_tag || 'main' }}
      server_core_image_tag: ${{ needs.build-servers.outputs.server_core_image_tag || 'main' }}
      server_team_allocation_image_tag: ${{ needs.build-servers.outputs.server_team_allocation_image_tag || 'main' }}
      server_assessment_image_tag: ${{ needs.build-servers.outputs.server_assessment_image_tag || 'main' }}
      server_interview_image_tag: ${{ needs.build-servers.outputs.server_interview_image_tag || 'main' }}
      server_self_team_allocation_image_tag: ${{ needs.build-servers.outputs.server_self_team_allocation_image_tag || 'main' }}
      server_certificate_image_tag: ${{ needs.build-servers.outputs.server_certificate_image_tag || 'main' }}
      certificate_image_tag: ${{ needs.build-clients.outputs.certificate_image_tag || 'main' }}
      presentation_image_tag: ${{ needs.build-clients.outputs.presentation_image_tag || 'main' }}
      server_presentation_image_tag: ${{ needs.build-servers.outputs.server_presentation_image_tag || 'main' }}
      server_infrastructure_setup_image_tag: ${{ needs.build-servers.outputs.server_infrastructure_setup_image_tag || 'main' }}
      server_ai_image_tag: ${{ needs.build-servers.outputs.server_ai_image_tag || 'main' }}
      infrastructure_setup_image_tag: ${{ needs.build-clients.outputs.infrastructure_setup_image_tag || 'main' }}
      ai_image_tag: ${{ needs.build-clients.outputs.ai_image_tag || 'main' }}

  # Publishes deploy.json for simple-cd (`.cd.yaml`), with every image pinned by digest.
  # simple-cd only takes it from a run that succeeds as a whole.
  publish-cd:
    needs: [build-clients, build-servers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Resolve image digests
        id: images
        env:
          # <name in deploy.json, the docker-compose.prod.yml service>=<image>:<tag>
          IMAGES: |
            server-core=prompt-server-core:${{ needs.build-servers.outputs.server_core_image_tag }}
            server-team-allocation=prompt-server-team-allocation:${{ needs.build-servers.outputs.server_team_allocation_image_tag }}
            server-self-team-allocation=prompt-server-self-team-allocation:${{ needs.build-servers.outputs.server_self_team_allocation_image_tag }}
            server-assessment=prompt-server-assessment:${{ needs.build-servers.outputs.server_assessment_image_tag }}
            server-interview=prompt-server-interview:${{ needs.build-servers.outputs.server_interview_image_tag }}
            server-certificate=prompt-server-certificate:${{ needs.build-servers.outputs.server_certificate_image_tag }}
            server-presentation=prompt-server-presentation:${{ needs.build-servers.outputs.server_presentation_image_tag }}
            server-infrastructure-setup=prompt-server-infrastructure-setup:${{ needs.build-servers.outputs.server_infrastructure_setup_image_tag }}
            server-ai=prompt-server-ai:${{ needs.build-servers.outputs.server_ai_image_tag }}
            client-core=prompt-clients-core:${{ needs.build-clients.outputs.core_image_tag }}
            client-assessment-component=prompt-clients-assessment-component:${{ needs.build-clients.outputs.assessment_image_tag }}
            client-interview-component=prompt-clients-interview-component:${{ needs.build-clients.outputs.interview_image_tag }}
            client-matching-component=prompt-clients-matching-component:${{ needs.build-clients.outputs.matching_image_tag }}
            client-team-allocation-component=prompt-clients-team-allocation-component:${{ needs.build-clients.outputs.team_allocation_image_tag }}
            client-self-team-allocation-component=prompt-clients-self-team-allocation-component:${{ needs.build-clients.outputs.self_team_allocation_image_tag }}
            client-example-component=prompt-clients-example-component:${{ needs.build-clients.outputs.example_image_tag }}
            client-certificate-component=prompt-clients-certificate-component:${{ needs.build-clients.outputs.certificate_image_tag }}
            client-presentation-component=prompt-clients-presentation-component:${{ needs.build-clients.outputs.presentation_image_tag }}
            client-infrastructure-setup-component=prompt-clients-infrastructure-setup-component:${{ needs.build-clients.outputs.infrastructure_setup_image_tag }}
            client-ai-component=prompt-clients-ai-component:${{ needs.build-clients.outputs.ai_image_tag }}
          SHA: ${{ github.sha }}
        # An image this run did not rebuild has no tag output; like deploy-dev, take it from `main`.
        # shortcut: the shared build workflow only outputs tags, so this reads the digest a tag
        # points to now. A tag a later run moved (say, when only this job is re-run) no longer
        # carries this commit as its revision label, so the job fails instead of publishing it.
        # Switch to a digest output once that workflow has one.
        run: |
          {
            echo 'list<<EOF'
            while IFS='=' read -r name image; do
              [ -n "$name" ] || continue
              want=$SHA
              if [[ "$image" == *: ]]; then image+=main; want=; fi
              ref="ghcr.io/prompt-edu/prompt/$image"
              digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
              [[ "$digest" == sha256:* ]] || { echo "::error::no digest for $ref" >&2; exit 1; }
              if [ -n "$want" ]; then
                # Read the label from the digest, not the tag, which may have moved since.
                revision=$(docker buildx imagetools inspect "${ref%:*}@$digest" --format '{{json .Image}}' |
                  jq -r '(if has("config") then [.] else [.[]] end) | [.[].config.Labels["org.opencontainers.image.revision"]] | unique | join(",")')
                [ "$revision" = "$want" ] || { echo "::error::$ref is built from $revision, not $want" >&2; exit 1; }
              fi
              echo "$name=$ref@$digest"
            done <<< "$IMAGES"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: Mtze/simple-cd/cd-publish@v0.1.0
        with:
          images: ${{ steps.images.outputs.list }}
