name: Quality Clients

on:
  workflow_call:

permissions:
  contents: read

jobs:
  single-tailwind-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that only core builds Tailwind
        run: ./scripts/check-remote-styles.sh

  quality-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clients
    strategy:
      matrix:
        module:
          - core
          - interview_component
          - matching_component
          - example_component
          - assessment_component
          - team_allocation_component
          - self_team_allocation_component
          - certificate_component
          - presentation_component
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Type check ${{ matrix.module }}
        run: yarn tsc -p "${{ matrix.module }}/tsconfig.json" --noEmit --pretty false
      - name: Lint components in ${{ matrix.module }}
        run: yarn biome check "${{ matrix.module }}" shared
      - name: Build component ${{ matrix.module }}
        run: yarn --cwd "${{ matrix.module }}" build

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clients
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - name: Run client unit tests
        run: yarn test --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=TestResults-clients.xml
      - name: Upload client test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Vitest-results-clients
          path: ./clients/TestResults-clients.xml

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the shipped client nginx config
        run: |
          docker run --rm \
            -v "$PWD/clients/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/clients/nginx/spa.conf:/etc/nginx/spa.conf:ro" \
            nginx:stable-alpine nginx -t
      - name: Validate the template repository's client nginx config
        run: |
          docker run --rm \
            -v "$PWD/template-repository/repo/client.nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
