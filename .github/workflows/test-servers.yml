name: Test Go Servers

on:
  workflow_call:
    inputs:
      servers:
        description: "JSON array of server directories to test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: inputs.servers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJSON(inputs.servers) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: "servers/**/*.sum"
      - name: Install dependencies
        run: cd servers/${{ matrix.directory }} && go mod download
      - name: Test with Go
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: cd servers/${{ matrix.directory }} && go test ./... -json > TestResults-${{ matrix.directory }}.json
      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Go-results-${{ matrix.directory }}
          path: ./servers/${{ matrix.directory }}/TestResults-${{ matrix.directory }}.json
