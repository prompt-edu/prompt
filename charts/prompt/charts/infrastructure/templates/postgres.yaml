{{- $pg := .Values.global.postgresql -}}
{{- $inCluster := eq $pg.mode "in-cluster" -}}

{{- /* Assemble the database set; add keycloak when bundled in-cluster. */}}
{{- $dbs := deepCopy $pg.databases -}}
{{- if eq .Values.global.keycloak.mode "in-cluster" -}}
{{- $_ := set $dbs "keycloak" (dict "dbName" "keycloak" "owner" "keycloak" "hostVar" "KC_DB_HOST" "portVar" "KC_DB_PORT") -}}
{{- end -}}

{{- /*
Resolve one password per role. In-cluster roles are generated once and then read
back with `lookup` so an upgrade never rotates them; this needs `get` on secrets
in the release namespace. External installs bring their own single account, so
neither `lookup` nor a generated value is involved.
*/}}
{{- $passwords := dict -}}
{{- if $inCluster -}}
{{- range $key, $db := $dbs -}}
  {{- $roleSecret := printf "%s-role-%s" $.Release.Name $key -}}
  {{- $existing := lookup "v1" "Secret" $.Release.Namespace $roleSecret -}}
  {{- if $existing -}}
    {{- $_ := set $passwords $key (index $existing.data "password" | b64dec) -}}
  {{- else -}}
    {{- $_ := set $passwords $key (randAlphaNum 32) -}}
  {{- end -}}
{{- end -}}
{{- end -}}

{{- if $inCluster }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $pg.clusterName }}
  labels:
    {{- include "prompt.labels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    {{- /* CNPG owns the instance PVCs, so deleting this Cluster deletes the data. */}}
    helm.sh/resource-policy: keep
spec:
  instances: {{ $pg.instances }}
  postgresql:
    parameters:
      max_connections: {{ $pg.maxConnections | quote }}
  storage:
    size: {{ $pg.storageSize }}
    {{- if $pg.storageClass }}
    storageClass: {{ $pg.storageClass }}
    {{- end }}
  managed:
    roles:
      {{- range $key, $db := $dbs }}
      - name: {{ $db.owner }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ printf "%s-role-%s" $.Release.Name $key }}
      {{- end }}
  {{- if .Values.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.backup.retention | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ include "prompt.appSecretName" . }}
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: {{ include "prompt.appSecretName" . }}
          key: S3_SECRET_KEY
  {{- end }}
{{- if $pg.pooler.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ printf "%s-pooler-rw" $pg.clusterName }}
  labels:
    {{- include "prompt.labels" (dict "root" . "component" "postgres-pooler") | nindent 4 }}
spec:
  cluster:
    name: {{ $pg.clusterName }}
  instances: {{ $pg.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: session
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ printf "%s-backup" $pg.clusterName }}
  labels:
    {{- include "prompt.labels" (dict "root" . "component" "postgres-backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $pg.clusterName }}
{{- end }}
{{- end }}

{{- /* Per-role basic-auth secrets (CNPG) - in-cluster only. */}}
{{- if $inCluster }}
{{- range $key, $db := $dbs }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-role-%s" $.Release.Name $key }}
  labels:
    {{- include "prompt.labels" (dict "root" $ "component" (printf "role-%s" $key)) | nindent 4 }}
  annotations:
    {{- /* Kept so the generated password survives uninstall and still matches the data. */}}
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ $db.owner | quote }}
  password: {{ index $passwords $key | quote }}
{{- end }}
{{- end }}

{{- /*
Per-phase application DB env secrets (both modes). Host, port and user resolve
through the shared helpers so this Secret, the DB-wait init container and the
pod checksum cannot disagree.
*/}}
{{- range $key, $db := $pg.databases }}
{{- $ctx := dict "root" $ "dbKey" $key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db-%s" $.Release.Name $key }}
  labels:
    {{- include "prompt.labels" (dict "root" $ "component" (printf "db-%s" $key)) | nindent 4 }}
type: Opaque
stringData:
  {{ $db.hostVar }}: {{ include "prompt.dbHost" $ctx | quote }}
  {{ $db.portVar }}: {{ include "prompt.dbPort" $ctx | quote }}
  DB_NAME: {{ $db.dbName | quote }}
  DB_USER: {{ include "prompt.dbUser" $ctx | quote }}
  {{- if $inCluster }}
  DB_PASSWORD: {{ index $passwords $key | quote }}
  {{- else }}
  DB_PASSWORD: {{ include "prompt.dbExternalPassword" $ctx | quote }}
  {{- end }}
{{- end }}
