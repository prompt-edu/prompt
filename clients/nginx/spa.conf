# Static and SPA rules shared by every client image. Included from inside the
# server block of clients/nginx/nginx.conf and of e2e/nginx/client-core.conf, so
# the e2e suite exercises the rules that actually ship.

root /usr/share/nginx/html;
gzip_static on;

# A missing asset must 404. Falling back to index.html answers with the SPA
# document under HTTP 200, which the browser parses as JavaScript and dies on
# silently: a stale index.html requesting last build's content-hashed bundles
# white-screens the app instead of surfacing a load error.
location ~* \.(?:js|mjs|css|map|json|webmanifest|gz|woff2?|ttf|eot|png|svg|jpe?g|gif|ico|webp|avif|wasm)$ {
  try_files $uri =404;
}

# The entry document, the Module Federation manifest and the generated runtime
# config carry no content hash, so a cached copy points at bundles that no
# longer exist after a redeploy.
location = /index.html {
  add_header Cache-Control "no-store" always;
}

location = /remoteEntry.js {
  try_files $uri =404;
  add_header Cache-Control "no-store" always;
}

location = /env.js {
  try_files $uri =404;
  add_header Cache-Control "no-store" always;
}

# The API belongs to a server the reverse proxy routes to. When that router
# disappears the request lands here, and the SPA document would reach the client
# as a JSON response.
location = /api {
  return 404;
}

location ^~ /api/ {
  return 404;
}

location / {
  index index.html index.htm;
  try_files $uri $uri/ /index.html;
}

error_page 500 502 503 504 /50x.html;

# root is inherited from server scope.
location = /50x.html {}
