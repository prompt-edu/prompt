# ============================================================================
# CI-only override that RESTORES e2e image builds from the GitHub Actions layer
# cache. Layered on top of docker-compose.e2e.yml **only in CI**
# (`-f docker-compose.e2e.yml -f docker-compose.e2e.cache.yml`), so local
# `make test-e2e` runs never touch the gha cache backend.
#
# This cache is cross-run, not per-run: the scopes below are written by one
# earlier shard (see docker-compose.e2e.cache-write.yml) and restored by every
# shard of every later run. That is where the win comes from - a PR that doesn't
# touch yarn.lock or go.sum restores the dependency and bundler layers instead
# of rebuilding them, so the shards need no build-once job in front of them.
#
# Read-only here on purpose: all 8 shards restore, exactly one exports.
# Each service uses a distinct scope. Requires a container-driver buildx builder
# (docker/setup-buildx-action) and crazy-max/ghaction-github-runtime, which
# exports the ACTIONS_* credentials that `type=gha` needs in a `run:` step.
# ============================================================================

services:
  server-core:
    build:
      cache_from:
        - type=gha,scope=e2e-server-core
  client-core:
    build:
      cache_from:
        - type=gha,scope=e2e-client-core
  clients-base:
    build:
      cache_from:
        - type=gha,scope=e2e-clients-base
  server-self-team-allocation:
    build:
      cache_from:
        - type=gha,scope=e2e-server-self-team-allocation
  client-self-team-allocation:
    build:
      cache_from:
        - type=gha,scope=e2e-client-self-team-allocation
  server-example:
    build:
      cache_from:
        - type=gha,scope=e2e-server-example
  client-example:
    build:
      cache_from:
        - type=gha,scope=e2e-client-example
  server-assessment:
    build:
      cache_from:
        - type=gha,scope=e2e-server-assessment
  client-assessment:
    build:
      cache_from:
        - type=gha,scope=e2e-client-assessment
  client-matching:
    build:
      cache_from:
        - type=gha,scope=e2e-client-matching
  server-interview:
    build:
      cache_from:
        - type=gha,scope=e2e-server-interview
  client-interview:
    build:
      cache_from:
        - type=gha,scope=e2e-client-interview
  server-certificate:
    build:
      cache_from:
        - type=gha,scope=e2e-server-certificate
  client-certificate:
    build:
      cache_from:
        - type=gha,scope=e2e-client-certificate
  server-team-allocation:
    build:
      cache_from:
        - type=gha,scope=e2e-server-team-allocation
  client-team-allocation:
    build:
      cache_from:
        - type=gha,scope=e2e-client-team-allocation
  e2e-runner:
    build:
      cache_from:
        - type=gha,scope=e2e-runner
