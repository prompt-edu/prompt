basePath: /infrastructure-setup/api
definitions:
  db.ProviderType:
    enum:
    - gitlab
    - slack
    - outline
    - rancher
    - keycloak
    type: string
    x-enum-varnames:
    - ProviderTypeGitlab
    - ProviderTypeSlack
    - ProviderTypeOutline
    - ProviderTypeRancher
    - ProviderTypeKeycloak
  db.ResourceScope:
    enum:
    - per_team
    - per_student
    type: string
    x-enum-varnames:
    - ResourceScopePerTeam
    - ResourceScopePerStudent
  db.ResourceStatus:
    enum:
    - pending
    - in_progress
    - created
    - failed
    - partial
    type: string
    x-enum-varnames:
    - ResourceStatusPending
    - ResourceStatusInProgress
    - ResourceStatusCreated
    - ResourceStatusFailed
    - ResourceStatusPartial
  execution.InstanceMemberResponse:
    properties:
      courseParticipationId:
        type: string
      granted:
        type: boolean
    type: object
  execution.MyResourceResponse:
    properties:
      granted:
        description: |-
          Granted says whether the latest run let the student in. It is null when there is no
          instance, or when its run predates member tracking.
        type: boolean
      name:
        description: Name is the name of the resource the provider was asked to create.
        type: string
      providerType:
        $ref: '#/definitions/db.ProviderType'
      resourceConfigId:
        type: string
      resourceType:
        type: string
      scope:
        $ref: '#/definitions/db.ResourceScope'
      status:
        allOf:
        - $ref: '#/definitions/db.ResourceStatus'
        description: |-
          Status is the status of the student's instance, or null when nothing has been
          provisioned for them from this config yet.
      teamName:
        description: TeamName names the team a per_team resource belongs to.
        type: string
      url:
        description: URL links to the resource, when there is anything there a student
          can open.
        type: string
    type: object
  execution.ProvisioningPreview:
    properties:
      queued:
        description: Queued counts targets that have no instance yet.
        type: integer
      requeued:
        description: Requeued counts failed or partial instances a trigger would retry.
        type: integer
      running:
        description: |-
          Running counts instances a run is still working on. While it is above zero a
          trigger is refused.
        type: integer
      students:
        description: |-
          Students counts the students resolved, or is null when no resource config is
          per_student.
        type: integer
      teams:
        description: Teams counts the teams resolved, or is null when no resource
          config is per_team.
        type: integer
      upToDate:
        description: UpToDate counts targets whose resource is already created.
        type: integer
    type: object
  execution.ResourceInstanceResponse:
    properties:
      courseParticipationId:
        type: string
      coursePhaseId:
        type: string
      createdAt:
        type: string
      errorMessage:
        type: string
      externalId:
        type: string
      externalUrl:
        type: string
      id:
        type: string
      members:
        description: |-
          Members lists the people the instance's latest run was for, and whether each was
          granted access. Empty until the instance has run.
        items:
          $ref: '#/definitions/execution.InstanceMemberResponse'
        type: array
      nameTemplate:
        type: string
      providerType:
        $ref: '#/definitions/db.ProviderType'
      resolvedName:
        description: |-
          ResolvedName is the name the provider was asked to create, so a failed row still
          says which resource it was.
        type: string
      resourceConfigId:
        type: string
      resourceType:
        type: string
      scope:
        $ref: '#/definitions/db.ResourceScope'
      status:
        $ref: '#/definitions/db.ResourceStatus'
      targetName:
        description: |-
          TargetName names the team or student the row is about, as core resolved it when the
          instance last ran. Empty until then.
        type: string
      teamId:
        type: string
      updatedAt:
        type: string
    type: object
  execution.TriggerSummary:
    properties:
      queued:
        description: Queued counts targets that had no instance yet.
        type: integer
      requeued:
        description: Requeued counts failed or partial instances reset for another
          attempt.
        type: integer
      upToDate:
        description: UpToDate counts targets whose resource was already created.
        type: integer
    type: object
  phaseconfigDTO.Response:
    properties:
      coursePhaseId:
        type: string
      semesterTag:
        type: string
    type: object
  phaseconfigDTO.UpsertRequest:
    properties:
      semesterTag:
        type: string
    type: object
  providerconfigDTO.AuthField:
    properties:
      description:
        type: string
      label:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        description: '"text" or "password"'
        type: string
    type: object
  providerconfigDTO.ProviderConfigResponse:
    properties:
      configured:
        description: |-
          Configured is false for a provider copied from another phase, which keeps the
          row but not the credentials.
        type: boolean
      id:
        type: string
      providerType:
        type: string
    type: object
  providerconfigDTO.UpsertRequest:
    properties:
      credentials:
        additionalProperties: true
        type: object
      providerType:
        type: string
    required:
    - credentials
    - providerType
    type: object
  resourceconfigDTO.CreateRequest:
    properties:
      nameTemplate:
        type: string
      permissionMapping:
        additionalProperties:
          type: string
        type: object
      providerType:
        type: string
      resourceExtraConfig:
        additionalProperties: true
        type: object
      resourceType:
        type: string
      scope:
        enum:
        - per_team
        - per_student
        type: string
    required:
    - nameTemplate
    - providerType
    - resourceType
    - scope
    type: object
  resourceconfigDTO.ResourceConfigResponse:
    properties:
      coursePhaseId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      nameTemplate:
        type: string
      permissionMapping:
        items:
          type: integer
        type: array
      providerType:
        type: string
      resourceExtraConfig:
        items:
          type: integer
        type: array
      resourceType:
        type: string
      scope:
        type: string
    type: object
  resourceconfigDTO.UpdateRequest:
    properties:
      nameTemplate:
        type: string
      permissionMapping:
        additionalProperties:
          type: string
        type: object
      resourceExtraConfig:
        additionalProperties: true
        type: object
      resourceType:
        type: string
      scope:
        enum:
        - per_team
        - per_student
        type: string
    required:
    - nameTemplate
    - resourceType
    - scope
    type: object
externalDocs:
  description: PROMPT Documentation
  url: https://prompt-edu.github.io/prompt/
host: localhost:8091
info:
  contact: {}
  description: Manages infrastructure resource provisioning for course phases.
  title: PROMPT Infrastructure Setup API
  version: "1.0"
paths:
  /course_phase/{coursePhaseID}/execute:
    post:
      description: Creates pending resource instances for configured targets and starts
        asynchronous provisioning.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/execution.TriggerSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Trigger infrastructure provisioning
      tags:
      - execution
  /course_phase/{coursePhaseID}/execute/preview:
    get:
      description: Runs the checks of a trigger and resolves its targets without writing
        anything, and reports how many instances a trigger would create, retry and
        leave alone.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/execution.ProvisioningPreview'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Preview infrastructure provisioning
      tags:
      - execution
  /course_phase/{coursePhaseID}/instances:
    get:
      description: Lists provisioned resource instances and their lifecycle status
        for a course phase.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/execution.ResourceInstanceResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List resource instances
      tags:
      - execution
  /course_phase/{coursePhaseID}/instances/{instanceID}:
    delete:
      description: Deletes a resource instance row in PROMPT. External provider resources
        are not deleted.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource instance ID
        in: path
        name: instanceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete resource instance
      tags:
      - execution
  /course_phase/{coursePhaseID}/instances/{instanceID}/retry:
    post:
      description: Resets a failed or partial resource instance to pending and starts
        asynchronous provisioning.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource instance ID
        in: path
        name: instanceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Retry failed resource instance
      tags:
      - execution
  /course_phase/{coursePhaseID}/my-resources:
    get:
      description: 'Lists every resource config of the phase as the calling student
        sees it: the instances provisioned for them or their team, with whether they
        were granted access, and configs that have provisioned nothing for them yet.
        Error details are never included.'
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/execution.MyResourceResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List the caller's resources
      tags:
      - execution
  /course_phase/{coursePhaseID}/provider-configs:
    get:
      description: Lists configured infrastructure providers for a course phase. Credentials
        are redacted.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/providerconfigDTO.ProviderConfigResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List provider configurations
      tags:
      - provider-configs
    put:
      consumes:
      - application/json
      description: Encrypts and stores credentials for an infrastructure provider.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Provider configuration
        in: body
        name: providerConfig
        required: true
        schema:
          $ref: '#/definitions/providerconfigDTO.UpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/providerconfigDTO.ProviderConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create or update provider configuration
      tags:
      - provider-configs
  /course_phase/{coursePhaseID}/provider-configs/{providerType}:
    delete:
      description: Removes stored credentials for a provider type. Resource configurations
        and instances for that provider cascade-delete.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Provider type
        enum:
        - gitlab
        - slack
        - outline
        - rancher
        - keycloak
        in: path
        name: providerType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete provider configuration
      tags:
      - provider-configs
  /course_phase/{coursePhaseID}/provider-configs/{providerType}/fields:
    get:
      description: Returns the credential fields required to configure a provider
        type.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Provider type
        enum:
        - gitlab
        - slack
        - outline
        - rancher
        - keycloak
        in: path
        name: providerType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/providerconfigDTO.AuthField'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get provider credential fields
      tags:
      - provider-configs
  /course_phase/{coursePhaseID}/provider-configs/{providerType}/resource-types:
    get:
      description: Returns the resource kinds a provider type can create.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Provider type
        enum:
        - gitlab
        - slack
        - outline
        - rancher
        - keycloak
        in: path
        name: providerType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get supported resource types
      tags:
      - provider-configs
  /course_phase/{coursePhaseID}/provider-configs/{providerType}/validate:
    post:
      description: Decrypts the stored provider credentials and validates them against
        the external provider.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Provider type
        enum:
        - gitlab
        - slack
        - outline
        - rancher
        - keycloak
        in: path
        name: providerType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Validate provider credentials
      tags:
      - provider-configs
  /course_phase/{coursePhaseID}/resource-configs:
    get:
      description: Lists all resource configurations for an infrastructure setup course
        phase.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/resourceconfigDTO.ResourceConfigResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List resource configurations
      tags:
      - resource-configs
    post:
      consumes:
      - application/json
      description: Creates a resource configuration describing what to provision per
        team or per student.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource configuration
        in: body
        name: resourceConfig
        required: true
        schema:
          $ref: '#/definitions/resourceconfigDTO.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resourceconfigDTO.ResourceConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create resource configuration
      tags:
      - resource-configs
  /course_phase/{coursePhaseID}/resource-configs/{resourceConfigID}:
    delete:
      description: Deletes a resource configuration and cascades to its resource instances.
        A configuration with provisioned instances requires confirm=true, because
        the instances are PROMPT's only record of the external resources, which are
        never deleted.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource configuration ID
        in: path
        name: resourceConfigID
        required: true
        type: string
      - description: Confirm dropping the records of provisioned instances
        in: query
        name: confirm
        type: boolean
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete resource configuration
      tags:
      - resource-configs
    get:
      description: Retrieves a single resource configuration by ID.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource configuration ID
        in: path
        name: resourceConfigID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resourceconfigDTO.ResourceConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get resource configuration
      tags:
      - resource-configs
    put:
      consumes:
      - application/json
      description: Updates a resource configuration.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Resource configuration ID
        in: path
        name: resourceConfigID
        required: true
        type: string
      - description: Resource configuration
        in: body
        name: resourceConfig
        required: true
        schema:
          $ref: '#/definitions/resourceconfigDTO.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resourceconfigDTO.ResourceConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update resource configuration
      tags:
      - resource-configs
  /course_phase/{coursePhaseID}/setup-config:
    get:
      description: Returns the semester tag configuration for an infrastructure setup
        course phase. Upstream team and participation data is wired via the standard
        phase configurator.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/phaseconfigDTO.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get infrastructure setup configuration
      tags:
      - infrastructure-setup-config
    put:
      consumes:
      - application/json
      description: Saves the semester tag configuration for an infrastructure setup
        course phase.
      parameters:
      - description: Course phase ID
        in: path
        name: coursePhaseID
        required: true
        type: string
      - description: Infrastructure setup configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/phaseconfigDTO.UpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/phaseconfigDTO.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create or update infrastructure setup configuration
      tags:
      - infrastructure-setup-config
securityDefinitions:
  ApiKeyAuth:
    description: 'Bearer token authentication. Use format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
